[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
# Lasna blocks expose no withdrawalsRoot, so stay on a pre-Shanghai target (no PUSH0).
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"
